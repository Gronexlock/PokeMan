<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧪 Pokémon: Ecos de Andara — Suite de Pruebas Unitarias</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --pass: #22c55e;
      --fail: #ef4444;
      --border: #334155;
    }
    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      border-bottom: 2px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    h1 {
      margin: 0 0 8px 0;
      font-size: 1.8rem;
      color: var(--accent);
    }
    .subtitle {
      color: var(--text-muted);
      margin: 0;
    }
    .summary-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      gap: 24px;
      margin-bottom: 24px;
      font-weight: bold;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .badge.pass { color: var(--pass); }
    .badge.fail { color: var(--fail); }
    .badge.total { color: var(--accent); }

    .suite-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .suite-title {
      font-size: 1.15rem;
      font-weight: bold;
      color: var(--accent);
      margin-bottom: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 8px;
    }
    .test-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 6px;
      margin-bottom: 6px;
      background: rgba(255, 255, 255, 0.03);
    }
    .test-item.pass {
      border-left: 4px solid var(--pass);
    }
    .test-item.fail {
      border-left: 4px solid var(--fail);
      background: rgba(239, 68, 68, 0.1);
    }
    .test-name {
      font-size: 0.95rem;
    }
    .test-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .error-log {
      color: var(--fail);
      font-family: monospace;
      font-size: 0.85rem;
      margin-top: 6px;
      padding-left: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧪 Suite de Pruebas Unitarias (QA)</h1>
      <p class="subtitle">Pokémon: Ecos de Andara — Fase 6 (BattleManager, SaveManager, QuestManager)</p>
    </header>

    <div id="summary" class="summary-card">
      <span class="badge total">Ejecutando pruebas...</span>
    </div>

    <div id="results"></div>
  </div>

  <script type="module">
    import { runAllSuites } from './testRunner.ts';
    import './battleManager.test.ts';
    import './saveManager.test.ts';
    import './questManager.test.ts';
    import './audioManager.test.ts';
    import './evolutionEngine.test.ts';
    import './storyManager.test.ts';
    import './abilitiesAndItems.test.ts';
    import './fieldMechanics.test.ts';
    import './narrativeExpansion.test.ts';

    async function run() {
      const stats = await runAllSuites();
      
      const summaryEl = document.getElementById('summary');
      const resultsEl = document.getElementById('results');

      summaryEl.innerHTML = `
        <span class="badge total">📦 Total: ${stats.total}</span>
        <span class="badge pass">✅ Aprobadas: ${stats.passed}</span>
        <span class="badge fail">❌ Fallidas: ${stats.failed}</span>
        <span style="margin-left: auto; color: var(--text-muted); font-size: 0.9rem;">⏱️ ${stats.durationMs.toFixed(2)} ms</span>
      `;

      const grouped = {};
      for (const r of stats.results) {
        if (!grouped[r.suiteName]) grouped[r.suiteName] = [];
        grouped[r.suiteName].push(r);
      }

      resultsEl.innerHTML = '';
      for (const [suite, tests] of Object.entries(grouped)) {
        const suiteEl = document.createElement('div');
        suiteEl.className = 'suite-card';
        
        let testsHtml = `<div class="suite-title">📦 ${suite}</div>`;
        for (const t of tests) {
          testsHtml += `
            <div class="test-item ${t.passed ? 'pass' : 'fail'}">
              <div class="test-name">${t.passed ? '✅' : '❌'} ${t.testName}</div>
              <div class="test-time">${t.durationMs.toFixed(2)} ms</div>
            </div>
            ${t.error ? `<div class="error-log">⚠️ Error: ${t.error.message}</div>` : ''}
          `;
        }
        suiteEl.innerHTML = testsHtml;
        resultsEl.appendChild(suiteEl);
      }
    }

    run();
  </script>
</body>
</html>
